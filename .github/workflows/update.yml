name: Auto Update AUR Package

'on':
  schedule:
    - cron: '0 */3 * * *' # Check every 3 hours
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if version has not changed'
        required: false
        type: boolean
        default: false
      target_version:
        description: 'Target version without "v" (e.g. 0.3.39, leave empty for latest)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check latest upstream version
        id: check_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          INPUT_VER="${{ github.event.inputs.target_version }}"
          FORCE="${{ github.event.inputs.force }}"

          if [ -n "$INPUT_VER" ]; then
            NEW_VER="${INPUT_VER#v}"
          else
            LATEST_TAG=""
            for i in 1 2 3; do
              RESP=$(curl -sL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/router-for-me/EasyCLIProxyAPI/releases/latest || true)
              TAG=$(echo "$RESP" | jq -r '.tag_name // empty')
              if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then
                LATEST_TAG="$TAG"
                break
              fi
              echo "Failed to fetch latest tag from GitHub API (attempt $i/3), retrying..."
              sleep 2
            done

            if [ -z "$LATEST_TAG" ]; then
              echo "Error: Failed to fetch latest release from GitHub API after 3 attempts"
              exit 1
            fi
            NEW_VER="${LATEST_TAG#v}"
          fi

          CURRENT_VER=$(sed -n 's/^pkgver=//p' PKGBUILD | tr -d '[:space:]')
          AUR_VER=$(curl -s "https://aur.archlinux.org/rpc/v5/info/easycliproxyapi-bin" | jq -r '.results[0].Version // empty' | cut -d- -f1)

          echo "Current package version in repo: $CURRENT_VER"
          echo "Current AUR RPC version: $AUR_VER"
          echo "Upstream latest version: $NEW_VER"

          if [ "$FORCE" = "true" ] || [ "$NEW_VER" != "$CURRENT_VER" ] || [ -n "$AUR_VER" -a "$NEW_VER" != "$AUR_VER" ]; then
            echo "need_update=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VER" >> "$GITHUB_OUTPUT"
          else
            echo "need_update=false" >> "$GITHUB_OUTPUT"
            echo "Already at latest version. No update needed."
          fi

      - name: Update PKGBUILD and .SRCINFO
        if: steps.check_version.outputs.need_update == 'true'
        env:
          NEW_VER: ${{ steps.check_version.outputs.new_version }}
        run: |
          docker run --rm -i \
            -e NEW_VER="$NEW_VER" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD:/pkg" \
            -w /pkg archlinux:base bash << 'EOF'
            set -euo pipefail

            # Enable parallel downloads & backup mirrors
            sed -i 's/^#ParallelDownloads = 5/ParallelDownloads = 5/' /etc/pacman.conf || true
            sed -i 's|^#\(Server = https://mirror.rackspace.com.*\)|\1|' /etc/pacman.d/mirrorlist || true
            sed -i 's|^#\(Server = https://mirrors.kernel.org.*\)|\1|' /etc/pacman.d/mirrorlist || true

            for i in 1 2 3; do
              if pacman -Syu --noconfirm --needed pacman sudo base-devel pacman-contrib curl; then
                break
              fi
              if [ "$i" -eq 3 ]; then
                echo "Pacman sync failed after 3 attempts."
                exit 1
              fi
              echo "Pacman sync failed, retrying ($i/3)..."
              sleep 3
            done

            useradd -m builder
            chown -R builder:builder /pkg
            su builder -c "sed -i 's/^pkgver=.*/pkgver=$NEW_VER/' /pkg/PKGBUILD"
            su builder -c "sed -i 's/^pkgrel=.*/pkgrel=1/' /pkg/PKGBUILD"

            for i in 1 2 3; do
              if su builder -c 'updpkgsums'; then
                break
              fi
              if [ "$i" -eq 3 ]; then
                echo "updpkgsums failed after 3 attempts."
                exit 1
              fi
              echo "updpkgsums failed, retrying ($i/3)..."
              sleep 3
            done

            su builder -c 'makepkg --printsrcinfo' > /pkg/.SRCINFO
            chown -R "$HOST_UID:$HOST_GID" /pkg
          EOF

      - name: Deploy to AUR and GitHub
        if: steps.check_version.outputs.need_update == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          NEW_VER: ${{ steps.check_version.outputs.new_version }}
        run: |
          set -euo pipefail

          # Setup SSH for AUR
          mkdir -p ~/.ssh
          echo "$AUR_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          AUR_SSH="ssh -i ~/.ssh/aur_key -o StrictHostKeyChecking=accept-new"

          # 1. Push to AUR in an isolated clean repository (strictly NO subdirectories)
          AUR_WORK_DIR=$(mktemp -d)
          GIT_SSH_COMMAND="$AUR_SSH" git clone ssh://aur@aur.archlinux.org/easycliproxyapi-bin.git "$AUR_WORK_DIR"

          # Copy only the flat AUR package files
          cp PKGBUILD .SRCINFO easycliproxyapi.sh easycliproxyapi.desktop "$AUR_WORK_DIR/"

          cd "$AUR_WORK_DIR"
          git config user.name "doudou"
          git config user.email "951028382@qq.com"

          git add PKGBUILD .SRCINFO easycliproxyapi.sh easycliproxyapi.desktop
          if ! git diff --cached --quiet; then
            git commit -m "feat: bump version to ${NEW_VER}"
            GIT_SSH_COMMAND="$AUR_SSH" git push origin master
            echo "Successfully deployed version ${NEW_VER} to AUR."
          else
            echo "AUR is already up to date with version ${NEW_VER}."
          fi

          # 2. Push to GitHub main branch
          cd "$GITHUB_WORKSPACE"
          git config user.name "doudou"
          git config user.email "951028382@qq.com"

          git add PKGBUILD .SRCINFO easycliproxyapi.sh easycliproxyapi.desktop
          if ! git diff --cached --quiet; then
            git commit -m "feat: bump version to ${NEW_VER}"
            git push origin main
            echo "Successfully updated GitHub repository."
          else
            echo "GitHub repository is already up to date."
          fi
